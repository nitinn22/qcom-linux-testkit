metadata:
  name: gstreamer-waylandsink-playback
  format: "Lava-Test Test Definition 1.0"
  description: >
    GStreamer waylandsink playback validation with Weston/Wayland server checks
    on Qualcomm Linux platforms. Uses videotestsrc to generate test patterns
    and displays them via waylandsink. Validates display connectivity and
    Wayland compositor functionality.
    By default runs 4 tests at standard resolutions: 480p, 720p, 1080p, 2160p.
    Custom resolution can be specified to run a single test.
  os:
    - linux
  scope:
    - functional

params:
  VIDEO_DURATION: "30"    # seconds
  VIDEO_PATTERN: "smpte"  # smpte|snow|black|white|red|green|blue|checkers-1|checkers-2|ball
  VIDEO_RESOLUTION: "480p,720p,1080p,2160p"  # Comma-separated list or single resolution (e.g., "1920x1080")
  VIDEO_FRAMERATE: "30"   # fps
  VIDEO_GST_DEBUG: "2"    # 1-9
  LAVA_TESTCASE_ID: "Waylandsink_Playback"

run:
  steps:
    - REPO_PATH="$PWD"
    - cd Runner/suites/Multimedia/GSTreamer/Display/Waylandsink_Playback/
    - export VIDEO_DURATION VIDEO_PATTERN VIDEO_RESOLUTION VIDEO_FRAMERATE VIDEO_GST_DEBUG
    - ./run.sh --resolution "${VIDEO_RESOLUTION}" --pattern "${VIDEO_PATTERN}" --duration "${VIDEO_DURATION}" --framerate "${VIDEO_FRAMERATE}" --gst-debug "${VIDEO_GST_DEBUG}" --lava-testcase-id "${LAVA_TESTCASE_ID}" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh Waylandsink_Playback.res
