# Multimedia Sample Apps Configuration
# This file defines all sample applications across audio, video, display, and camera categories

description: GStreamer multimedia sample applications validation (audio, video, display, camera)

# Build Configuration:
# - Config1 (Upstream): 16 apps total (2 audio + 7 video + 7 camera + 0 display)
# - Config2 (CAMX/Downstream): 33 apps total (2 audio + 10 video + 20 camera + 1 display)
# Auto-detected based on qtiqmmfsrc plugin availability

# Default settings
defaults:
  timeout: 30
  validation:
    - check: exit_code
      expected: [0, 124]  # 0 = clean exit, 124 = timeout (acceptable for continuous apps)
    - check: no_gst_errors
      enabled: true

# Sample applications organized by category
categories:
  
  # MM_Audio Applications (available in both Config1 and Config2)
  audio:
    - name: gst-audio-encode-example
      description: Audio encoding example
      timeout: 30
      
    - name: gst-audio-decode-example
      description: Audio decoding example
      timeout: 30

  # MM_Video Applications
  video:
    # Common apps (available in both Config1 and Config2)
    - name: gst-concurrent-videoplay-composition
      description: Concurrent video playback with composition
      timeout: 30
      
    - name: gst-concurrent-videoplay-composition.py
      description: Concurrent video playback with composition (Python)
      timeout: 30
      
    - name: gst-videocodec-concurrent-playback
      description: Concurrent video codec playback
      timeout: 30
      
    - name: gst-audio-video-playback
      description: Audio and video playback
      timeout: 30
      
    - name: gst-video-transcode-example
      description: Video transcoding example
      timeout: 30
      
    - name: gst-video-playback-example
      description: Basic video playback example
      timeout: 30
      
    - name: gst-opencv-transform.py
      description: OpenCV transform example (Python)
      timeout: 30
    
    # Config2-only apps
    - name: gst-smartcodec-example
      description: Smart codec example (Config2 only)
      timeout: 30
      build_config: config2
      
    - name: gst-audio-video-encode
      description: Audio and video encoding (Config2 only)
      timeout: 30
      build_config: config2
      
    - name: gst-ai-smartcodec-example
      description: AI-enhanced smart codec example (Config2 only)
      timeout: 30
      build_config: config2

